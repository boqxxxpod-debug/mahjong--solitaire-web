name: Codex Merge Eligibility

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-merge-eligibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-external-merge-eligibility:
    if: >-
      !github.event.pull_request.draft &&
      startsWith(github.event.pull_request.head.ref, 'codex/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check repository and labels
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh api "repos/$REPO/issues/$PR" --jq '[.labels[].name] | join("\n")')"

          if ! grep -Fxq 'codex' <<< "$labels"; then
            echo 'Codex label is missing; external merge is not eligible.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fxq 'manual-review' <<< "$labels"; then
            echo 'manual-review label is present; external merge is not eligible.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Reject infrastructure-sensitive changes
        id: paths
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')"
          printf '%s\n' "$files"

          if grep -Eq '^(\.github/|AGENTS\.md$|STATE\.md$|CODEOWNERS$|package(-lock)?\.json$|tsconfig.*\.json$|vite\.config\.|playwright\.config\.)' <<< "$files"; then
            echo 'Infrastructure-sensitive file changed; manual review required.'
            echo 'safe=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'safe=true' >> "$GITHUB_OUTPUT"

      - name: Report eligibility to the external orchestrator
        if: steps.eligibility.outputs.eligible == 'true' && steps.paths.outputs.safe == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Eligible head SHA: $HEAD_SHA"
          echo 'GitHub Actions will not merge or reserve auto-merge for this pull request.'
          echo 'The externally authenticated orchestrator must revalidate this exact head SHA and perform the merge.'
