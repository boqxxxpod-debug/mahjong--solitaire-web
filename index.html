<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#071a24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Shanghai 3D Diorama</title>
  </head>
  <body>
    <main id="app" aria-label="上海3Dゲーム">
      <header class="hud">
        <div>
          <p class="eyebrow">MAHJONG SOLITAIRE</p>
          <h1>上海 <span>3D DIORAMA</span></h1>
        </div>
        <div class="hud-actions">
          <div class="stats"><div class="counter"><b id="remaining">44</b><small> TILES</small></div><div class="counter difficulty-counter"><b id="difficulty">NORMAL</b><small> LEVEL</small></div><div class="counter"><b id="time">00:00</b><small> TIME</small></div><div class="counter"><b id="moves">0</b><small> MOVES</small></div></div>
          <div class="mode-row"><button id="mode-menu" aria-haspopup="dialog">CLASSIC ▾</button><div class="difficulty-picker" aria-label="難易度選択"><button data-difficulty="easy">EASY</button><button data-difficulty="normal" aria-pressed="true">NORMAL</button><button data-difficulty="hard">HARD</button></div></div>
          <div class="buttons"><button id="undo">UNDO</button><button id="hint">HINT</button><button data-shuffle>SHUFFLE</button><button data-restart>RESTART</button></div>
        </div>
      </header>
      <div id="message" role="status" aria-live="polite" aria-atomic="true">同じ牌を2枚選んでください</div>
      <section id="tray" class="tray" aria-label="5枠トレイ" hidden><b>TRAY</b><div id="tray-slots"></div></section>
      <div id="result" class="clear" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-detail" aria-hidden="true" inert><span id="result-title">CLEAR</span><small id="result-detail">盤面をすべて片付けました</small><div class="result-actions"><button id="result-undo" class="restart-result" hidden>安全な手まで戻る</button><button id="result-shuffle" class="restart-result" data-shuffle>SHUFFLE</button><button id="result-restart" class="restart-result" data-restart>もう一度遊ぶ</button><button id="replay-deal" class="restart-result" hidden>REPLAY SAME DEAL</button><button id="new-deal" class="restart-result" hidden>NEW DEAL</button><button id="next-stage" class="restart-result" hidden>NEXT STAGE</button></div></div>
      <section id="mode-sheet" class="mode-sheet" role="dialog" aria-modal="true" aria-labelledby="mode-title" aria-hidden="true" inert>
        <div class="mode-card"><div class="sheet-heading"><div><p class="eyebrow">PLAY MODE</p><h2 id="mode-title">Choose a game</h2></div><button id="close-mode" aria-label="選択画面を閉じる">CLOSE</button></div>
          <h3>PLAY RULE</h3><div class="rule-picker"><button data-rule="pair"><b>ペア</b><small>同じ牌を盤面で2枚選択</small></button><button data-rule="tray"><b>トレイ</b><small>難易度別3〜5枠・同牌2枚で消去</small></button></div>
          <button id="choose-classic" class="mode-choice"><b>CLASSIC</b><small>EASY / NORMAL / HARD</small></button>
          <h3>DIORAMA TOUR</h3><div id="stage-list" class="stage-list"></div>
        </div>
      </section>
      <canvas id="game-canvas" aria-label="3D麻雀牌のゲーム盤"></canvas>
      <pre id="debug-overlay" role="alert" hidden></pre>
      <footer>FREE TILE <i></i> 上に牌がなく、左右どちらかが空いている牌<br><span>裏向きのFREE TILEはタップすると表になります</span></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
